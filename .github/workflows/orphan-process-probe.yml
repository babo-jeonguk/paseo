name: orphan-process-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex @opencode/cli
          npm install --prefix "$RUNNER_TEMP/opencode1" opencode-ai
          if [ "$RUNNER_OS" = Windows ]; then bin="$(cygpath -w "$RUNNER_TEMP/opencode1/node_modules/.bin/opencode.cmd")"; else bin="$RUNNER_TEMP/opencode1/node_modules/.bin/opencode"; fi
          echo "OPENCODE1_BIN=$bin" >> "$GITHUB_ENV"
      - name: Versions
        run: |
          claude --version || true
          codex --version || true
          opencode --version || true
          "$OPENCODE1_BIN" --version || true
          python --version
      - name: Probe
        run: |
          i=0
          for a in claude codex opencode opencode1; do
            for v in direct nested; do
              i=$((i+1))
              node probe.mjs "$a" "$v" $((18100+i)) || echo "probe crashed: $a $v"
            done
          done
      - name: Probe Windows strategies
        if: runner.os == 'Windows'
        run: |
          i=40
          for s in snapshot job; do
            for a in claude opencode1; do
              for v in direct nested; do
                i=$((i+1))
                PROBE_STRATEGY=$s node probe.mjs "$a" "$v" $((18100+i)) || echo "probe crashed: $s $a $v"
              done
            done
          done
      - name: Summary
        if: always()
        run: |
          echo "### ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          node summarize.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: probe/results
