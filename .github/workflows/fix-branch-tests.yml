name: fix-branch-tests
# Runs the tests touched by fix/reap-provider-descendants on all three platforms.
on:
  push:
    branches: [ci/orphan-process-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reap-provider-descendants
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai
      - name: Build server dependencies
        run: npm run build:server-deps
      - name: Head commit
        shell: bash
        run: git log -1 --format='%H %s'
      - name: Provider process tests
        working-directory: packages/server
        run: npx vitest run src/server/agent/provider-process src/server/agent/providers/jsonl-rpc-process.test.ts
      - name: Provider suites that spawn through it
        working-directory: packages/server
        run: npx vitest run src/server/agent/providers/claude/agent.env.test.ts src/server/agent/providers/claude/models.test.ts src/server/agent/providers/codex-app-server-agent.spawn-error.test.ts src/server/agent/providers/opencode-server-manager.test.ts src/server/agent/providers/acp-startup-exit.test.ts
      - name: Daemon bootstrap and shutdown
        working-directory: packages/server
        run: npx vitest run src/server/bootstrap.smoke.test.ts
